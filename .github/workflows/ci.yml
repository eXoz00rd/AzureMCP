name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore AzureDevOpsServer.Mcp.slnx
      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build AzureDevOpsServer.Mcp.slnx --configuration Release --no-restore
      - name: Install coverage tool
        run: dotnet tool install --global dotnet-coverage
      - name: Test with coverage
        run: dotnet-coverage collect --output coverage.cobertura.xml --output-format cobertura "dotnet run --project tests/AzureDevOpsServer.Mcp.Tests --configuration Release --no-build"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.cobertura.xml
      - name: Pack
        run: dotnet pack src/AzureDevOpsServer.Mcp --configuration Release --no-build --output artifacts
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*.nupkg
