name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build AzureDevOpsServer.Mcp.slnx --configuration Release
      - name: Test
        run: dotnet run --project tests/AzureDevOpsServer.Mcp.Tests --configuration Release --no-build
      - name: Pack
        run: dotnet pack src/AzureDevOpsServer.Mcp --configuration Release --no-build --output artifacts
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*.nupkg
