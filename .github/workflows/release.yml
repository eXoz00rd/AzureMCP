name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build
        run: dotnet build AzureDevOpsServer.Mcp.slnx --configuration Release -p:Version=${{ env.VERSION }}
      - name: Test
        run: dotnet run --project tests/AzureDevOpsServer.Mcp.Tests --configuration Release --no-build
      - name: Publish self-contained linux-x64 server
        run: >-
          dotnet publish src/AzureDevOpsServer.Mcp --configuration Release --runtime linux-x64
          --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:PackAsTool=false -p:Version=${{ env.VERSION }} --output publish/linux-x64
      - name: Generate Open WebUI plugin
        run: |
          mkdir -p release
          asset=AzureDevOpsServer.Mcp-linux-x64
          cp publish/linux-x64/AzureDevOpsServer.Mcp "release/$asset"
          sha=$(sha256sum "release/$asset" | cut -d' ' -f1)
          echo "$sha  $asset" > "release/$asset.sha256"
          dotnet run --project tools/OpenWebUiPluginGenerator --configuration Release --no-build -- \
            --output release/azure_devops_openwebui.py \
            --download-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$asset" \
            --sha256 "$sha"
          python3 -c "import sys; compile(open(sys.argv[1]).read(), sys.argv[1], 'exec')" release/azure_devops_openwebui.py
      - name: Pack
        run: dotnet pack src/AzureDevOpsServer.Mcp --configuration Release --no-build --output artifacts -p:Version=${{ env.VERSION }}
      - name: Verify packaged manifest version
        run: |
          packages=(artifacts/*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .nupkg in artifacts/, found ${#packages[@]}"
            exit 1
          fi
          package="${packages[0]}"
          expected=$(basename "$package" .nupkg)
          expected=${expected#AzureDevOpsServer.Mcp.}
          unzip -p "$package" .mcp/server.json > packed-server.json
          manifest=$(jq -r '.version' packed-server.json)
          entry=$(jq -r '.packages[0].version' packed-server.json)
          if [ "$manifest" != "$expected" ] || [ "$entry" != "$expected" ]; then
            echo "::error::Version mismatch: package=$expected manifest=$manifest packages[0]=$entry"
            exit 1
          fi
          echo "Packaged manifest matches the package version: $expected"
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: eXoz0rd
      - name: Push to NuGet.org
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Attach Open WebUI assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Releases are written by hand: attach to one that already exists, otherwise start a draft to finish and publish.
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber

  image:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Name the image
        # Registry paths must be lowercase, and the owner name is not.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/azuremcp" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v4
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
